<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATIG — Живая сфера</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #controls { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; z-index: 20; }
        button {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid #a855f7;
            padding: 14px 32px;
            border-radius: 60px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button.active { background: #a855f7; box-shadow: 0 0 20px #a855f7; }
        #status { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 20px; z-index: 10; font-size: 12px; }
        #chat { position: absolute; bottom: 120px; left: 20px; right: 20px; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); border-radius: 20px; padding: 12px; color: white; font-size: 14px; z-index: 15; border: 1px solid #a855f7; }
        .user { color: #a855f7; }
        .atig { color: #22d3ee; }
    </style>
</head>
<body>
    <div id="status">🌀 ATIG <span id="status-text">готов</span></div>
    <div id="chat"></div>
    <div id="controls"><button id="mic-btn">🎤 Начать диалог</button></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // СЦЕНА
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010105);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.8);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
        bloomPass.strength = 0.7;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Звёзды
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = [];
        for (let i = 0; i < 1500; i++) {
            starsPos.push((Math.random() - 0.5) * 200);
            starsPos.push((Math.random() - 0.5) * 100);
            starsPos.push((Math.random() - 0.5) * 80);
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsPos), 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06 }));
        scene.add(stars);
        
        // Частицы вокруг сферы
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = [];
        for (let i = 0; i < 1200; i++) {
            const r = 1.5 + Math.random() * 0.6;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            particlePos.push(r * Math.sin(phi) * Math.cos(theta));
            particlePos.push(r * Math.sin(phi) * Math.sin(theta));
            particlePos.push(r * Math.cos(phi));
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(particlePos), 3));
        const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xa855f7, size: 0.012, blending: THREE.AdditiveBlending }));
        scene.add(particles);
        
        // Сфера
        const sphereGeo = new THREE.SphereGeometry(1.2, 128, 128);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0x7c3aed, emissive: 0x4c1d95, emissiveIntensity: 0.6, metalness: 0.7, roughness: 0.3, transparent: true, opacity: 0.95 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(sphere);
        
        // Свет
        const ambient = new THREE.AmbientLight(0x1a0a3a);
        scene.add(ambient);
        const mainLight = new THREE.PointLight(0xa855f7, 1);
        mainLight.position.set(2, 2, 3);
        scene.add(mainLight);
        
        // Параллакс мыши
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX/window.innerWidth)*2-1;
            mouseY = (e.clientY/window.innerHeight)*2-1;
        });
        
        // ДИАЛОГ
        let isActive = false;
        let recognition = null;
        const micBtn = document.getElementById('mic-btn');
        const chatDiv = document.getElementById('chat');
        const statusSpan = document.getElementById('status-text');
        
        function addMessage(sender, text) {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerHTML = `<span class="${sender}">${sender === 'user' ? '🗣 Вы' : '🌀 ATIG'}:</span> ${text}`;
            chatDiv.appendChild(msg);
            chatDiv.scrollTop = chatDiv.scrollHeight;
            while (chatDiv.children.length > 10) chatDiv.removeChild(chatDiv.firstChild);
        }
        
        function speak(text) {
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        function getResponse(text) {
            const q = text.toLowerCase();
            if (q.includes('привет')) return "Привет! Я ATIG. Говори что угодно, я слушаю.";
            if (q.includes('как дела')) return "Я сияю в космосе. А как ты?";
            if (q.includes('кто ты')) return "Я ATIG — живая сфера, персональный интеллект.";
            if (q.includes('что ты умеешь')) return "Слушать, отвечать и светиться от твоего голоса.";
            return `Я слышу: "${text}". Расскажи ещё.`;
        }
        
        function processInput(userText) {
            addMessage('user', userText);
            const response = getResponse(userText);
            addMessage('atig', response);
            speak(response);
            sphere.scale.set(1.08, 1.08, 1.08);
            mainLight.intensity = 1.4;
            setTimeout(() => { sphere.scale.set(1,1,1); mainLight.intensity = 1; }, 400);
        }
        
        function startListening() {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.onstart = () => {
                isActive = true;
                micBtn.textContent = '🔴 Выключить';
                micBtn.classList.add('active');
                statusSpan.textContent = 'слушаю...';
            };
            recognition.onresult = (e) => {
                let final = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                }
                if (final.trim()) processInput(final.trim());
            };
            recognition.onerror = () => { if (isActive) startListening(); };
            recognition.onend = () => { if (isActive) startListening(); };
            recognition.start();
        }
        
        function stopListening() {
            if (recognition) recognition.stop();
            isActive = false;
            micBtn.textContent = '🎤 Начать диалог';
            micBtn.classList.remove('active');
            statusSpan.textContent = 'готов';
        }
        
        micBtn.onclick = () => isActive ? stopListening() : startListening();
        
        addMessage('atig', 'Я ATIG. Нажми на кнопку и говори со мной.');
        
        // Анимация
        let time = 0;
        function animate() {
            time += 0.012;
            sphere.rotation.y = time * 0.2;
            particles.rotation.y = time * 0.04;
            stars.rotation.y = time * 0.01;
            camera.position.x += ((mouseX * 0.2) - camera.position.x) * 0.05;
            camera.position.y += ((-mouseY * 0.12) - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);
            effectComposer.render();
            requestAnimationFrame(animate);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
